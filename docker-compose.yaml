services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immich_insights}
      POSTGRES_USER: ${POSTGRES_USER:-immich_insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-immich_insights}
      POSTGRES_USER: ${POSTGRES_USER:-immich_insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_SECRET_FILE: /data/fernet.key
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    volumes:
      - ./data/secrets:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - immich

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4983:80"
    depends_on:
      - backend

networks:
  immich:
    external: true
    name: ${IMMICH_DOCKER_NETWORK:-immich-app_default}
