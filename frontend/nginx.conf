server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css application/manifest+json;
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location ~ ^/(icon.*\.(svg|png)|apple-touch-icon.*\.png|favicon.*\.(ico|png)|safari-pinned-tab\.svg)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location /api/ { proxy_pass http://backend:8000/; }
  location /health { proxy_pass http://backend:8000/health; }
  location / { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri $uri/ /index.html; }
}
